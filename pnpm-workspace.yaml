allowBuilds:
  "@tailwindcss/oxide": true
  # Testcontainers' transitive Docker plumbing. None of the three build steps is needed: the tests reach
  # Docker over the local socket, so ssh2's optional native acceleration never runs.
  cpu-features: false
  esbuild: true
  protobufjs: false
  ssh2: false

overrides:
  chokidar: ^5.0.0
  semver: ^7.0.0

blockExoticSubdeps: true
minimumReleaseAge: 1440
trustPolicy: no-downgrade
engineStrict: true
preferFrozenLockfile: true
patchedDependencies:
  "@sveltejs/kit@3.0.0-next.12": patches/@sveltejs__kit@3.0.0-next.12.patch
