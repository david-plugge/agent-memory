services:
  db:
    image: postgres
    restart: always
    ports:
      # 5433 on the host so this database can run alongside other local
      # projects that bind the default 5432 (e.g. hunga).
      - 5433:5432
    environment:
      POSTGRES_USER: root
      POSTGRES_PASSWORD: mysecretpassword
      POSTGRES_DB: local
    volumes:
      - pgdata:/var/lib/postgresql
volumes:
  pgdata:
